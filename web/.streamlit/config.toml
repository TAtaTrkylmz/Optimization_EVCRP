[server]
headless = true
address = "0.0.0.0"
port = 8501
enableCORS = false
enableXsrfProtection = false

[theme]
primaryColor = "#2563EB"
backgroundColor = "#0f172a"
secondaryBackgroundColor = "#1e293b"
