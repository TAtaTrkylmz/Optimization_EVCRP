font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap, sans-serif"
codeFont = "'Space Mono':https://fonts.googleapis.com/css2?family=Space+Mono&display=swap, monospace"

[browser]
gatherUsageStats = false
